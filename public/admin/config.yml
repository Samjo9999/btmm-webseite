# Decap CMS — BtMM Web (OSS, 0 €). Nicht direkt master für Live.
locale: de
backend:
  name: github
  repo: Samjo9999/btmm-webseite
  branch: content/cms
  # base_url + auth_endpoint setzt index.html zur Laufzeit
  squash_merges: true
  commit_messages:
    create: "cms: {{collection}} angelegt"
    update: "cms: {{collection}} aktualisiert"
    delete: "cms: {{collection}} gelöscht"
    uploadMedia: "cms: Medien {{path}}"
    deleteMedia: "cms: Medien {{path}} gelöscht"

media_folder: public/images/cms
public_folder: /images/cms
publish_mode: simple

collections:
  - name: home_de
    label: Startseite (DE)
    files:
      - name: home
        label: home.json
        file: messages/de/home.json
